<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17122b">
  <meta name="description" content="JUNOVABOOK - Réseau social">
  <title>JUNOVABOOK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #100d20, #21123d, #32145a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 22px;
      border-radius: 30px;
      background: linear-gradient(135deg, #7c3aed, #d946ef, #06b6d4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: bold;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 38px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .slogan {
      font-size: 17px;
      color: #ddd6fe;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 25px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 17px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(90deg, #8b5cf6, #d946ef);
      color: white;
    }

    .secondary {
      background: rgba(255,255,255,.12);
      color: white;
      border: 1px solid rgba(255,255,255,.2);
    }

    .language {
      margin-top: 25px;
      color: #c4b5fd;
      font-size: 14px;
    }

    select {
      margin-top: 8px;
      padding: 10px 15px;
      border-radius: 10px;
      background: #211936;
      color: white;
      border: 1px solid #6d5a9e;
    }

    footer {
      margin-top: 25px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">J</div>

    <h1>JUNOVABOOK</h1>

    <p class="slogan">
      Le réseau social qui rapproche les personnes,
      les idées et les communautés.
    </p>

    <div class="card">

      <button class="primary" onclick="createAccount()">
        👉 Créer mon compte
      </button>

      <button class="secondary" onclick="login()">
        🔐 Se connecter
      </button>

      <div class="language">
        🌍 Choisir la langue
        <br>
        <select>
          <option>Français</option>
          <option>English</option>
          <option>Español</option>
          <option>Português</option>
          <option>Deutsch</option>
        </select>
      </div>

    </div>

    <footer>
      © 2026 JUNOVABOOK
    </footer>

  </div>

  <script>
    function createAccount() {
      alert("La création de compte JUNOVABOOK sera disponible prochainement.");
    }

    function login() {
      alert("La connexion JUNOVABOOK sera disponible prochainement.");
    }
  </script>

  <!-- Appwrite -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@21.0.0"></script>

  <script>
    const client = new Appwrite.Client();

    client
      .setEndpoint("https://fra.cloud.appwrite.io/v1")
      .setProject("6ac5feea0027070c3293");
  </script>

</body>
    </html>
